name: Java CI Pipeline
 
on:
 push:
   branches:
     - main
 pull_request:
   branches:
     - main
 
jobs:
 build:
   runs-on: ubuntu-latest
 
   steps:
     # -----------------------------------------
     # 1. Checkout source code
     # -----------------------------------------
     - name: Checkout Code
       uses: actions/checkout@v4
       with:
         fetch-depth: 0
 
     # -----------------------------------------
     # 2. Setup JDK 21
     # -----------------------------------------
     - name: Setup JDK 21
       uses: actions/setup-java@v4
       with:
         distribution: temurin
         java-version: '21'
         cache: maven
 
     # -----------------------------------------
     # 3. Build and Run Unit Tests
     # -----------------------------------------
     - name: Build and Test
       run: mvn clean verify
 
     # -----------------------------------------
     # 4. Generate / Verify JaCoCo Coverage
     # -----------------------------------------
     - name: Generate JaCoCo Coverage Report
       run: mvn jacoco:report
 
     # -----------------------------------------
     # 5. Check Code Coverage >= 90%
     # -----------------------------------------
     - name: Check Code Coverage
       shell: bash
       run: |
         python3 - <<'PY'
         # (same Python coverage check script as before)
         PY
 
     # -----------------------------------------
     # 6. SonarQube Analysis
     # -----------------------------------------
     - name: SonarQube Analysis
       uses: SonarSource/sonarqube-scan-action@v7
       env:
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
 
     # -----------------------------------------
     # 7. SonarQube Quality Gate
     # -----------------------------------------
     - name: SonarQube Quality Gate
       uses: SonarSource/sonarqube-quality-gate-action@v1
       timeout-minutes: 10
       env:
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
 
     # -----------------------------------------
     # 8. Package Application
     # -----------------------------------------
     - name: Package JAR
       run: mvn package -DskipTests
 
     # -----------------------------------------
     # 9. Upload JAR
     # -----------------------------------------
     - name: Upload JAR Artifact
       uses: actions/upload-artifact@v4
       with:
         name: springboot-application
         path: target/*.jar
 
     # -----------------------------------------
     # 10. Upload JaCoCo Report
     # -----------------------------------------
     - name: Upload JaCoCo Report
       if: always()
       uses: actions/upload-artifact@v4
       with:
         name: jacoco-report
         path: target/site/jacoco/
 
     # -----------------------------------------
     # 11. Build Docker Image
     # -----------------------------------------
     - name: Build Docker Image
       run: docker build -t myapp:latest .
 
     # -----------------------------------------
     # 12. Push Docker Image to Registry
     # -----------------------------------------
     - name: Login to DockerHub
       uses: docker/login-action@v2
       with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}
 
     - name: Push Docker Image
       run: |
         docker tag myapp:latest ${{ secrets.DOCKER_USERNAME }}/myapp:latest
         docker push ${{ secrets.DOCKER_USERNAME }}/myapp:latest
 